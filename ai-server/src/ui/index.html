<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OmniDesigner Agent</title>
<link rel="stylesheet" href="/styles.css">
<script src="/qwebchannel.js"></script>
</head>
<body>
<header class="topbar">
  <div class="brand">OMNI<span>DESIGNER</span></div>
  <div class="statusline">
    <span id="connDot" class="dot"></span>
    <span id="fileLabel" class="file-label">未绑定文件</span>
    <span class="sep"></span>
    <span id="selLabel" class="sel-label">未选中控件</span>
  </div>
  <div class="top-actions">
    <button id="modelPill" class="pill" title="模型与服务商设置">未配置模型</button>
    <button id="themeBtn" class="icon-btn" title="切换主题">主题</button>
    <button id="settingsBtn" class="icon-btn">设置</button>
  </div>
</header>

<div id="notice" class="notice" hidden>
  <span id="noticeText"></span>
  <button id="noticeAction">去设置</button>
</div>

<div class="toolbar">
  <button id="shotBtn">截图检查</button>
  <button id="layoutBtn">检查布局</button>
  <button id="changesBtn">版本历史</button>
  <button id="codeBtn">编辑 .ui</button>
  <button id="clearBtn">清空对话</button>
  <span class="spacer"></span>
  <label class="switch" title="发送消息时附带设计器中选中的控件">
    <input id="attachToggle" type="checkbox" checked>
    <span>附带选中控件</span>
  </label>
</div>

<main class="workspace">
  <section class="chatpane">
    <div id="selectionBar" class="selection-bar" hidden>
      <span class="selection-label">当前选中</span>
      <span id="selectionChip" class="chip"></span>
      <span id="selectionHint" class="hint">会随下一条消息发送给 Agent</span>
    </div>

    <div id="timeline" class="timeline">
      <div class="empty-state" id="emptyState">
        <div class="empty-title">OmniDesigner Agent</div>
        <p>打开一个 .ui 文件，在设计器里选中控件，然后描述你想改什么。</p>
        <p class="muted">Agent 会读取界面、检查遮挡、修改文件，并给出可回退的版本。</p>
      </div>
    </div>

    <div class="composer">
      <textarea id="userInput" rows="3" placeholder="描述你要修改的界面，例如：把选中的按钮改成主色调，并检查是否会挡住下面的输入框"></textarea>
      <div class="composer-actions">
        <span id="runStatus" class="run-status">就绪</span>
        <span class="spacer"></span>
        <button id="stopBtn" class="danger" hidden>停止</button>
        <button id="sendBtn" class="primary">发送</button>
      </div>
    </div>
  </section>
</main>

<aside id="drawer" class="drawer" hidden>
  <div class="drawer-head">
    <div id="drawerTabs" class="drawer-tabs">
      <button data-tab="history">版本历史</button>
      <button data-tab="code">编辑 .ui</button>
      <button data-tab="visual">视觉检查</button>
      <button data-tab="layout">布局问题</button>
    </div>
    <button id="drawerClose" class="icon-btn">关闭</button>
  </div>
  <div id="drawerBody" class="drawer-body"></div>
</aside>

<div id="settingsModal" class="modal-backdrop" hidden>
  <div class="modal">
    <div class="modal-head">
      <h2>设置</h2>
      <button id="settingsClose" class="icon-btn">关闭</button>
    </div>

    <section class="settings-section">
      <div class="section-title">01 服务商</div>
      <div class="row">
        <select id="providerSelect" class="grow"></select>
        <button id="providerAdd">新增</button>
        <button id="providerDelete" class="danger">删除</button>
      </div>
      <label>名称</label>
      <input id="providerName" type="text" placeholder="例如 DeepSeek / 本地 Ollama / 中转站">
      <label>接口地址 BASE_URL</label>
      <input id="providerBase" type="text" placeholder="https://api.deepseek.com">
      <label>API 密钥</label>
      <input id="providerKey" type="password" placeholder="sk-...">
    </section>

    <section class="settings-section">
      <div class="section-title">02 模型</div>
      <div class="row">
        <input id="modelInput" class="grow" type="text" list="modelList" placeholder="输入模型名，不绑定任何厂商">
        <datalist id="modelList"></datalist>
        <button id="fetchModelsBtn">拉取模型</button>
      </div>
      <div class="muted small" id="modelHint">可直接填写任意 OpenAI 兼容模型名。</div>
      <label>视觉模型（可选，用于看截图）</label>
      <input id="visionModel" type="text" placeholder="例如 gpt-4o / qwen-vl-max / glm-4v">
      <label class="check">
        <input id="supportsVision" type="checkbox">
        <span>当前主模型本身支持图片输入</span>
      </label>
    </section>

    <section class="settings-section">
      <div class="section-title">03 Agent 参数</div>
      <div class="grid3">
        <div>
          <label>温度</label>
          <input id="temperature" type="number" step="0.1" min="0" max="2">
        </div>
        <div>
          <label>最大输出</label>
          <input id="maxTokens" type="number" step="256" min="256">
        </div>
        <div>
          <label>最大步数</label>
          <input id="maxSteps" type="number" step="1" min="1">
        </div>
      </div>
      <label class="check">
        <input id="showReasoning" type="checkbox">
        <span>显示模型推理过程</span>
      </label>
    </section>

    <div class="modal-foot">
      <span id="settingsStatus" class="muted small"></span>
      <span class="spacer"></span>
      <button id="testBtn">测试连接</button>
      <button id="settingsSave" class="primary">保存</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
